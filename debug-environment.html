<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environment Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🔍 Environment Debug</h1>
    <div id="debug-info"></div>
    
    <script src="js/config.js"></script>
    <script>
        const debugDiv = document.getElementById('debug-info');
        
        function addDebug(message, type = 'debug-info') {
            const div = document.createElement('div');
            div.className = `debug-info ${type}`;
            div.innerHTML = message;
            debugDiv.appendChild(div);
        }
        
        // Debug environment detection
        addDebug('<h3>🌍 Environment Detection Debug</h3>');
        
        // Check if config is loaded
        if (typeof window.envConfig !== 'undefined') {
            addDebug('✅ Environment config loaded successfully', 'success');
            
            // Get environment info
            const environment = window.envConfig.getEnvironment();
            const apiUrl = window.envConfig.getApiBaseUrl();
            const fullConfig = window.envConfig.getFullConfig();
            
            addDebug(`<strong>Environment:</strong> ${environment}`, environment === 'production' ? 'success' : 'warning');
            addDebug(`<strong>API Base URL:</strong> ${apiUrl}`, apiUrl.includes('localhost') ? 'error' : 'success');
            addDebug(`<strong>Hostname:</strong> ${fullConfig.hostname}`);
            addDebug(`<strong>Protocol:</strong> ${fullConfig.protocol}`);
            addDebug(`<strong>Port:</strong> ${fullConfig.port}`);
            
            // Test API URL
            addDebug('<h3>🔗 API URL Test</h3>');
            if (apiUrl.includes('localhost')) {
                addDebug('❌ <strong>PROBLEM FOUND:</strong> API URL is pointing to localhost instead of production!', 'error');
                addDebug('This means the environment detection is not working correctly.', 'error');
            } else {
                addDebug('✅ API URL looks correct for production', 'success');
            }
            
        } else {
            addDebug('❌ Environment config not loaded!', 'error');
        }
        
        // Manual environment check
        addDebug('<h3>🔧 Manual Environment Check</h3>');
        const hostname = window.location.hostname;
        const protocol = window.location.protocol;
        
        addDebug(`<strong>Current hostname:</strong> ${hostname}`);
        addDebug(`<strong>Current protocol:</strong> ${protocol}`);
        
        if (hostname.includes('the4loop.com')) {
            addDebug('✅ Hostname contains the4loop.com - should be production', 'success');
        } else {
            addDebug('⚠️ Hostname does not contain the4loop.com', 'warning');
        }
        
        if (protocol === 'https:') {
            addDebug('✅ Using HTTPS protocol', 'success');
        } else {
            addDebug('⚠️ Not using HTTPS protocol', 'warning');
        }
        
        // Test API connection
        addDebug('<h3>🌐 API Connection Test</h3>');
        
        if (typeof window.envConfig !== 'undefined') {
            const apiUrl = window.envConfig.getApiBaseUrl();
            
            fetch(`${apiUrl}/health`)
                .then(response => {
                    if (response.ok) {
                        addDebug('✅ API health check successful!', 'success');
                        return response.json();
                    } else {
                        addDebug(`❌ API health check failed: ${response.status}`, 'error');
                    }
                })
                .then(data => {
                    if (data) {
                        addDebug(`API Response: ${JSON.stringify(data)}`, 'success');
                    }
                })
                .catch(error => {
                    addDebug(`❌ API connection error: ${error.message}`, 'error');
                    addDebug('This confirms the port/connection issue!', 'error');
                });
        }
    </script>
</body>
</html>
