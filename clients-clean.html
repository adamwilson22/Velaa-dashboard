<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - Velaa</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="images/logos/logo.svg" alt="Velaa Logo">
                </div>
            </div>
            <div class="sidebar-content">
                <div class="user-greeting">
                    <p>Good Evening</p>
                    <p>Mr: Manager's name</p>
                </div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item">
                        <img src="images/icons/dashboard.svg" alt="Dashboard">
                        <span>Dashboard</span>
                    </a>
                    <a href="vehicles.html" class="nav-item">
                        <img src="images/icons/vehicles.svg" alt="Vehicles">
                        <span>Vehicles</span>
                    </a>
                    <a href="vehicle-billing.html" class="nav-item">
                        <img src="images/icons/bag 1.png" alt="Billing">
                        <span>Billing</span>
                    </a>
                    <a href="clients.html" class="nav-item active">
                        <img src="images/icons/clients.svg" alt="Clients">
                        <span>Clients</span>
                    </a>
                    <a href="#" class="nav-item">
                        <img src="images/icons/Bell.png" alt="Reports">
                        <span>Reports</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-main">
            <!-- Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <h1 class="header-title">Clients</h1>
                </div>
                <div class="header-right">
                    <div class="search-container">
                        <img src="images/icons/search.svg" alt="Search" class="search-icon">
                    </div>
                    <div class="notifications">
                        <button class="notification-btn">
                            <img src="images/icons/Bell.png" alt="Notifications">
                            <span class="notification-badge">3</span>
                        </button>
                    </div>
                    <div class="user-profile" onclick="toggleProfileDropdown()">
                        <img src="images/avatar.png" alt="Profile" class="profile-avatar">
                    </div>
                </div>
            </header>

            <!-- Content -->
            <main class="dashboard-layout__content">
                <div class="dashboard-container">
                    <div class="clients-container">
                        <!-- Search and Filter Controls -->
                        <div class="clients-controls">
                            <div class="search-section">
                                <div class="search-input-container">
                                    <img src="images/icons/search.svg" alt="Search" class="search-icon">
                                    <input type="text" id="clientTableSearch" class="clients-table-search" placeholder="Search client by name">
                                </div>
                            </div>
                            <div class="filter-controls">
                                <select id="typeFilter" class="filter-select">
                                    <option value="">All Types</option>
                                    <option value="Individual">Individual</option>
                                    <option value="Company">Company</option>
                                    <option value="Dealer">Dealer</option>
                                </select>
                                <select id="statusFilter" class="filter-select">
                                    <option value="">All Status</option>
                                    <option value="true">Active</option>
                                    <option value="false">Inactive</option>
                                </select>
                            </div>
                            <div class="add-client-btn" onclick="window.location.href='client-add.html'">
                                <div class="btn-content">
                                    <div class="btn-label">Add New Client</div>
                                </div>
                                <div class="btn-icon">↗</div>
                            </div>
                            <button onclick="testLoadClients()" style="margin-left: 10px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px;">Test Load</button>
                        </div>

                        <!-- Clients Table -->
                        <div class="clients-table-container">
                            <div class="clients-table-scroll">
                                <div class="clients-table">
                                    <div class="clients-table-header">
                                        <div class="clients-cell clients-cell--name">Client name</div>
                                        <div class="clients-cell clients-cell--phone">Phone number</div>
                                        <div class="clients-cell clients-cell--balance">Outstanding balance</div>
                                        <div class="clients-cell clients-cell--type">Client type</div>
                                        <div class="clients-cell clients-cell--actions">Actions</div>
                                    </div>
                                    <!-- Dynamic content will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Profile Dropdown -->
    <div class="profile-dropdown" id="profileDropdown">
        <div class="profile-dropdown-header">
            <img src="images/avatar.png" alt="Profile" class="profile-avatar">
            <div class="profile-info">
                <h3>Manager's Name</h3>
                <p>manager@velaa.com</p>
            </div>
        </div>
        <div class="profile-dropdown-menu">
            <a href="#" class="dropdown-item">Profile Settings</a>
            <a href="#" class="dropdown-item">Account Settings</a>
            <a href="#" class="dropdown-item">Help & Support</a>
            <a href="#" class="dropdown-item logout" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="profile-dropdown-overlay" id="profileDropdownOverlay" onclick="closeProfileDropdown()"></div>

    <script src="js/api.js"></script>
    <script src="js/scripts.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Check if user is authenticated
        if (!window.velaaAPI?.token) {
            console.log('No authentication token found, redirecting to login');
            NotificationManager.error('Please login first to access clients');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
            return;
        }
        
        const searchInput = document.getElementById('clientSearchInput');
        const tableSearchInput = document.getElementById('clientTableSearch');
        const typeFilter = document.getElementById('typeFilter');
        const statusFilter = document.getElementById('statusFilter');
        const table = document.querySelector('.clients-table');
        let currentClients = [];

        async function renderClients(clients) {
            const header = table.querySelector('.clients-table-header');
            table.innerHTML = '';
            table.appendChild(header);
            
            if (!clients || clients.length === 0) {
                const noDataRow = document.createElement('div');
                noDataRow.className = 'clients-table-row';
                noDataRow.innerHTML = `
                    <div class="clients-cell clients-cell--name" style="grid-column: 1 / -1; text-align: center; padding: 2rem; color: #666;">
                        No clients found
                    </div>
                `;
                table.appendChild(noDataRow);
                return;
            }

            clients.forEach(client => {
                const row = document.createElement('div');
                row.className = 'clients-table-row';
                row.innerHTML = `
                    <div class="clients-cell clients-cell--name">${client.name || ''}</div>
                    <div class="clients-cell clients-cell--phone">${client.phone || ''}</div>
                    <div class="clients-cell clients-cell--balance">${client.outstandingBalance ? client.outstandingBalance.toLocaleString() + ' TZS' : '0 TZS'}</div>
                    <div class="clients-cell clients-cell--type">${client.type || ''}</div>
                    <div class="clients-cell clients-cell--actions">
                        <div class="action-dropdown">
                            <button class="action-btn" onclick="toggleActionMenu(this)">⋮</button>
                            <div class="action-menu">
                                <button onclick="editClient('${client._id}')">Edit</button>
                                <button onclick="toggleClientStatus('${client._id}', ${client.isActive})">${client.isActive ? 'Deactivate' : 'Activate'}</button>
                                <button onclick="deleteClient('${client._id}')" class="danger">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                table.appendChild(row);
            });
        }

        async function loadClients() {
            try {
                console.log('Loading clients...');
                console.log('Current token:', window.velaaAPI?.token || 'No token');
                console.log('Is authenticated:', !!window.velaaAPI?.token);
                
                loadingManager.show('clients-load', 'Loading clients...');
                const params = {
                    page: 1,
                    limit: 50,
                    search: tableSearchInput.value.trim(),
                    type: typeFilter.value,
                    isActive: statusFilter.value
                };
                
                console.log('API params:', params);
                console.log('velaaAPI available:', !!window.velaaAPI);
                const response = await window.velaaAPI.getClients(params);
                console.log('API response:', response);
                
                currentClients = response.data || [];
                console.log('Current clients:', currentClients);
                await renderClients(currentClients);
            } catch (e) {
                console.error('Error loading clients:', e);
                if (e.message && e.message.includes('Access denied')) {
                    NotificationManager.error('Please login first to view clients');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    NotificationManager.error('Failed to load clients: ' + e.message);
                }
            } finally {
                loadingManager.hide('clients-load');
            }
        }

        const doSearch = FleetManager.debounce(loadClients, 400);

        // Event listeners
        if (tableSearchInput) {
            tableSearchInput.addEventListener('input', doSearch);
        }
        if (typeFilter) {
            typeFilter.addEventListener('change', loadClients);
        }
        if (statusFilter) {
            statusFilter.addEventListener('change', loadClients);
        }

        // Action functions
        window.editClient = (clientId) => {
            const client = currentClients.find(c => c._id === clientId);
            if (client) {
                sessionStorage.setItem('editingClient', JSON.stringify(client));
                window.location.href = `client-add.html?edit=true`;
            }
        };

        window.toggleClientStatus = async (clientId, currentStatus) => {
            try {
                const updates = { isActive: !currentStatus };
                await window.velaaAPI.updateClient(clientId, updates);
                NotificationManager.success(`Client ${!currentStatus ? 'activated' : 'deactivated'} successfully`);
                loadClients();
            } catch (error) {
                console.error('Error toggling client status:', error);
                NotificationManager.error('Failed to update client status');
            }
        };

        window.deleteClient = async (clientId) => {
            if (confirm('Are you sure you want to delete this client?')) {
                try {
                    await window.velaaAPI.deleteClient(clientId);
                    NotificationManager.success('Client deleted successfully');
                    loadClients();
                } catch (error) {
                    console.error('Error deleting client:', error);
                    NotificationManager.error('Failed to delete client');
                }
            }
        };

        window.toggleActionMenu = (button) => {
            const menu = button.nextElementSibling;
            const isOpen = menu.classList.contains('show');
            
            // Close all other menus
            document.querySelectorAll('.action-menu.show').forEach(m => m.classList.remove('show'));
            
            // Toggle current menu
            if (!isOpen) {
                menu.classList.add('show');
            }
        };

        // Close action menus when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.action-dropdown')) {
                document.querySelectorAll('.action-menu.show').forEach(m => m.classList.remove('show'));
            }
        });

        // Test function
        window.testLoadClients = () => {
            console.log('Testing load clients...');
            loadClients();
        };

        // Initial load
        loadClients();
    });
    </script>
</body>
</html>
