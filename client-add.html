<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Client - Fleet Management System</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page page--dashboard">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <div class="sidebar__header-top">
                    <h1 class="sidebar__brand">Velaa</h1>
                    <button class="sidebar__close" onclick="closeSidebar()">×</button>
                </div>
                <div class="sidebar__greeting">
                    <p class="sidebar__greeting-text">Good Evening</p>
                    <p class="sidebar__greeting-name">Mr : Managers name</p>
                </div>
            </div>

            <nav class="sidebar__nav">
                <ul class="sidebar__nav-list">
                    <li class="sidebar__nav-item">
                        <a href="dashboard.html" class="sidebar__nav-link">
                            <span class="nav-text">Dashboard</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/dashboard 1.png" alt="Dashboard" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="vehicles.html" class="sidebar__nav-link">
                            <span class="nav-text">Vehicles</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/car (1).png" alt="Vehicles" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="vehicle-billing.html" class="sidebar__nav-link">
                            <span class="nav-text">Billing</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/bag 1.png" alt="Billing" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="clients.html" class="sidebar__nav-link sidebar__nav-link--active">
                            <span class="nav-text">Clients</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/customer 1.png" alt="Clients" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="#" class="sidebar__nav-link">
                            <span class="nav-text">Reports</span>
                            <span class="sidebar__nav-icon">📋</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-layout__main">
            <!-- Header -->
            <header class="header">
                <div class="header__left">
                    <button class="mobile-menu-toggle" onclick="toggleSidebar()">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>

                <div class="header__center">
                    <h1 class="header__title">Add new client</h1>
                </div>

                <div class="header__right">
                    <button class="header__notifications">
                        <div class="notification-icon-container">
                            <img src="images/icons/Bell.png" alt="Notifications" class="notification-icon">
                            <span class="notification-dot"></span>
                        </div>
                        <span class="notification-text">Notifications</span>
                    </button>
                    <div class="header__profile" onclick="toggleProfileDropdown()">
                        <div class="header__profile-avatar">
                            <img src="images/avatar.png" alt="Owner" class="avatar-img">
                        </div>
                        
                        
                        <!-- Profile Dropdown Menu -->
                        <div class="profile-dropdown" id="profileDropdown">
                            <div class="dropdown-section">
                                <h3 class="dropdown-section-title">My Account</h3>
                                <div class="dropdown-menu-item">
                                    <span>Profile Picture</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                                <div class="dropdown-menu-item">
                                    <span>Password and security</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                                <div class="dropdown-menu-item">
                                    <span>Personal Details</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                            </div>
                            
                            <div class="dropdown-section">
                                <h3 class="dropdown-section-title">Support</h3>
                                <div class="dropdown-menu-item">
                                    <span>Help</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                                <div class="dropdown-menu-item">
                                    <span>Privacy center</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                                <div class="dropdown-menu-item">
                                    <span>Account status</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                                <div class="dropdown-menu-item">
                                    <span>About us</span>
                                    <span class="dropdown-arrow">›</span>
                                </div>
                            </div>
                            
                            <div class="dropdown-section">
                                <h3 class="dropdown-section-title">Login</h3>
                                <div class="dropdown-menu-item logout">
                                    <span>Log out</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <main class="dashboard-layout__content">
                <div class="dashboard-container">
                    <div class="client-form-container">
                        <form class="client-form" novalidate>
                            <!-- Row 1: Three columns -->
                            <div class="form-row three-columns">
                                <div class="form-group">
                                    <label class="form-label">Enter client name</label>
                                    <input type="text" class="form-input" name="client_name" placeholder="Enter client name" required>
                                    <div class="form__error" data-error-for="name"></div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Enter client phone number</label>
                                    <input type="tel" class="form-input" name="phone_number" placeholder="Enter client phone number" required>
                                    <div class="form__error" data-error-for="phone"></div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Client type</label>
                                    <div class="dropdown-container">
                                        <select class="form-input" name="client_type" required>
                                            <option value="">Select client type</option>
                                            <option value="individual">Individual</option>
                                            <option value="dealer">Dealer</option>
                                            <option value="company">Company</option>
                                        </select>
                                    </div>
                                    <div class="form__error" data-error-for="type"></div>
                                </div>
                            </div>

                            <!-- Row 2: Single column -->
                            <div class="form-row single-column">
                                <div class="form-group">
                                    <label class="form-label">System status</label>
                                    <select class="form-input" name="system_status" required>
                                        <option value="">Active / Inactive</option>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                    <div class="form__error" data-error-for="isActive"></div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="form-row single-column">
                                <button type="submit" class="submit-btn">Submit</button>
                                <button type="button" onclick="testAPI()" style="margin-top: 10px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px;">Test API</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Profile Dropdown Overlay -->
    <div class="profile-dropdown-overlay" id="profileDropdownOverlay" onclick="closeProfileDropdown()"></div>

    <script src="js/config.js?v=2.0.1"></script>
    <script src="js/api.js?v=2.0.1"></script>
    <script src="js/auth-helper.js?v=2.0.1"></script>
    <script src="js/scripts.js?v=2.0.1"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM loaded, initializing client form');
        console.log('velaaAPI available:', !!window.velaaAPI);
        console.log('loadingManager available:', !!window.loadingManager);
        console.log('NotificationManager available:', !!window.NotificationManager);
        
        const form = document.querySelector('.client-form');
        const phoneInput = document.querySelector('input[name="phone_number"]');
        const nameInput = document.querySelector('input[name="client_name"]');
        const typeSelect = document.querySelector('select[name="client_type"]');
        const statusSelect = document.querySelector('select[name="system_status"]');
        const submitBtn = document.querySelector('.submit-btn');
        
        console.log('Form elements found:', { form: !!form, phoneInput: !!phoneInput, nameInput: !!nameInput, typeSelect: !!typeSelect, statusSelect: !!statusSelect, submitBtn: !!submitBtn });
        
        // Check if we're in edit mode
        const urlParams = new URLSearchParams(window.location.search);
        const isEditMode = urlParams.get('edit') === 'true';
        let editingClientId = null;
        
        // Load client data if editing
        if (isEditMode) {
            const clientData = sessionStorage.getItem('editingClient');
            if (clientData) {
                try {
                    const client = JSON.parse(clientData);
                    editingClientId = client._id;
                    nameInput.value = client.name || '';
                    phoneInput.value = client.phone || '';
                    typeSelect.value = (client.type || '').toLowerCase();
                    statusSelect.value = client.isActive ? 'active' : 'inactive';
                    submitBtn.textContent = 'Update Client';
                    document.querySelector('.header__title').textContent = 'Edit Client';
                } catch (e) {
                    console.error('Failed to parse client data:', e);
                    NotificationManager.error('Failed to load client data');
                }
            }
        }
        
        // Tanzania phone formatting
        if (phoneInput) {
            phoneInput.addEventListener('blur', () => {
                const formatted = window.velaaAPI.formatTanzaniaPhone(phoneInput.value);
                phoneInput.value = formatted;
            });
        }

        function clearFieldErrors() {
            form.querySelectorAll('.form__error').forEach(el => { el.textContent = ''; });
        }

        function setFieldError(fieldName, message) {
            const errorEl = form.querySelector(`.form__error[data-error-for="${CSS.escape(fieldName)}"]`);
            if (errorEl) errorEl.textContent = message;
        }

        function validateClientData(client) {
            const errors = [];
            
            if (!client.name || client.name.trim().length < 2) {
                errors.push({ field: 'name', message: 'Client name must be at least 2 characters.' });
            }
            
            if (!client.phone || !window.velaaAPI.validateTanzaniaPhone(client.phone)) {
                errors.push({ field: 'phone', message: 'Please enter a valid Tanzania phone number.' });
            }
            
            if (!['Individual', 'Dealer', 'Company'].includes(client.type)) {
                errors.push({ field: 'type', message: 'Please select a valid client type.' });
            }
            
            return errors;
        }

        if (form) {
            console.log('Form found, adding submit listener');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('Form submitted, preventing default');
                try {
                    loadingManager.show('add-client', `${isEditMode ? 'Updating' : 'Saving'} client...`);
                    const formData = new FormData(form);

                    const client = {
                        name: (formData.get('client_name') || '').toString().trim(),
                        phone: window.velaaAPI.formatTanzaniaPhone(formData.get('phone_number') || ''),
                        type: (formData.get('client_type') || '').toString().charAt(0).toUpperCase() + (formData.get('client_type') || '').toString().slice(1),
                        isActive: formData.get('system_status') === 'active'
                    };

                    clearFieldErrors();
                    const frontErrors = validateClientData(client);
                    console.log('Frontend validation errors:', frontErrors);
                    if (frontErrors.length) {
                        frontErrors.forEach(e => setFieldError(e.field, e.message));
                        NotificationManager.error('Please correct the highlighted errors.');
                        return;
                    }

                    console.log('Client data to submit:', client);
                    let response;
                    if (isEditMode && editingClientId) {
                        console.log('Updating client with ID:', editingClientId);
                        response = await window.velaaAPI.updateClient(editingClientId, client);
                        console.log('Update response:', response);
                        NotificationManager.success('Client updated successfully');
                    } else {
                        console.log('Creating new client');
                        response = await window.velaaAPI.createClient(client);
                        console.log('Create response:', response);
                        NotificationManager.success('Client added successfully');
                    }
                    window.location.href = 'clients.html';
                    return response;
                } catch (err) {
                    console.error(err);
                    let msg = err?.getUserMessage ? err.getUserMessage() : (err?.message || `Failed to ${isEditMode ? 'update' : 'add'} client`);
                    if (Array.isArray(err?.data?.errors)) {
                        clearFieldErrors();
                        err.data.errors.forEach(e => setFieldError(e.field || e.path || 'form', e.message || 'Invalid'));
                        msg = 'Validation failed. Please review errors.';
                    } else if (err?.data?.errors && typeof err.data.errors === 'object') {
                        Object.entries(err.data.errors).forEach(([field, messages]) => setFieldError(field, Array.isArray(messages)?messages.join(', '):String(messages)));
                        msg = 'Validation failed. Please review errors.';
                    }
                    NotificationManager.error(msg);
                } finally {
                    loadingManager.hide('add-client');
                }
            });
        }
        // Test API function
        window.testAPI = async () => {
            console.log('Testing API...');
            try {
                const response = await window.velaaAPI.createClient({
                    name: 'Test Client',
                    phone: '+255123456789',
                    type: 'Individual',
                    isActive: true
                });
                console.log('API test successful:', response);
                NotificationManager.success('API test successful!');
            } catch (error) {
                console.error('API test failed:', error);
                NotificationManager.error('API test failed: ' + error.message);
            }
        };
    });
    </script>
</body>
</html>
