<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Client - Velaa</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/loader.css">
</head>
<body class="page page--dashboard">
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading Client<span class="loader-dots">...</span></div>
    </div>

    <div class="dashboard-layout page-content">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <div class="sidebar__header-top">
                    <h1 class="sidebar__brand">Velaa</h1>
                    <button class="sidebar__close" onclick="closeSidebar()">×</button>
                </div>
                <div class="sidebar__greeting">
                    <p class="sidebar__greeting-text">Good Evening</p>
                    <p class="sidebar__greeting-name">Mr : Managers name</p>
                </div>
            </div>

            <nav class="sidebar__nav">
                <ul class="sidebar__nav-list">
                    <li class="sidebar__nav-item">
                        <a href="dashboard.html" class="sidebar__nav-link">
                            <span class="nav-text">Dashboard</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/dashboard 1.png" alt="Dashboard" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="vehicles.html" class="sidebar__nav-link">
                            <span class="nav-text">Vehicles</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/car (1).png" alt="Vehicles" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="vehicle-billing.html" class="sidebar__nav-link">
                            <span class="nav-text">Billing</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/bag 1.png" alt="Billing" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="clients.html" class="sidebar__nav-link sidebar__nav-link--active">
                            <span class="nav-text">Clients</span>
                            <span class="sidebar__nav-icon"><img src="images/icons/customer 1.png" alt="Clients" class="nav-icon"></span>
                        </a>
                    </li>
                    <li class="sidebar__nav-item">
                        <a href="#" class="sidebar__nav-link">
                            <span class="nav-text">Reports</span>
                            <span class="sidebar__nav-icon">📋</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-layout__main">
            <!-- Header -->
            <header class="header">
                <button class="mobile-menu-toggle" id="menuToggle">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                <div class="header__center">
                    <h1 class="header__title">Edit Client</h1>
                </div>
                <div class="header__right">
                    <button class="header__notifications">
                        <div class="notification-icon-container">
                            <img src="images/icons/Bell.png" alt="Notifications" class="notification-icon">
                            <span class="notification-dot"></span>
                        </div>
                        <span class="notification-text">Notifications</span>
                    </button>
                    <div class="header__profile" onclick="toggleProfileDropdown()">
                        <div class="header__profile-avatar">
                            <img src="images/avatar.png" alt="Owner" class="avatar-img">
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <main class="dashboard-layout__content">
                <div class="dashboard-container">
                    <div class="client-form-container">
                        <form class="client-form" novalidate>
                            <!-- Row 1: Three columns -->
                            <div class="form-row three-columns">
                                <div class="form-group">
                                    <label class="form-label">Enter client name</label>
                                    <input type="text" class="form-input" name="client_name" placeholder="Enter client name" required>
                                    <div class="form__error" data-error-for="name"></div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Enter client phone number</label>
                                    <input type="tel" class="form-input" name="phone_number" placeholder="Enter client phone number" required>
                                    <div class="form__error" data-error-for="phone"></div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Client type</label>
                                    <select class="form-input" name="client_type" required>
                                        <option value="">Select client type</option>
                                        <option value="individual">Individual</option>
                                        <option value="company">Company</option>
                                        <option value="dealer">Dealer</option>
                                    </select>
                                    <div class="form__error" data-error-for="type"></div>
                                </div>
                            </div>

                            <!-- Row 2: Two columns -->
                            <div class="form-row two-columns">
                                <div class="form-group">
                                    <label class="form-label">System status</label>
                                    <select class="form-input" name="system_status" required>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                    <div class="form__error" data-error-for="isActive"></div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="form-row single-column">
                                <button type="submit" class="submit-btn">Update Client</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Profile Dropdown Overlay -->
    <div class="profile-dropdown-overlay" id="profileDropdownOverlay" onclick="closeProfileDropdown()"></div>

    <script src="js/config.js?v=2.0.1"></script>
    <script src="js/api.js?v=2.0.1"></script>
    <script src="js/auth-helper.js?v=2.0.1"></script>
    <script src="js/scripts.js?v=2.0.1"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const pageLoader = document.getElementById('pageLoader');
        const pageContent = document.querySelector('.page-content');
        
        console.log('DOM loaded, initializing client edit form');
        console.log('velaaAPI available:', !!window.velaaAPI);
        console.log('loadingManager available:', !!window.loadingManager);
        console.log('NotificationManager available:', !!window.NotificationManager);
        
        const form = document.querySelector('.client-form');
        const phoneInput = document.querySelector('input[name="phone_number"]');
        const nameInput = document.querySelector('input[name="client_name"]');
        const typeSelect = document.querySelector('select[name="client_type"]');
        const statusSelect = document.querySelector('select[name="system_status"]');
        const submitBtn = document.querySelector('.submit-btn');
        
        console.log('Form elements found:', { form: !!form, phoneInput: !!phoneInput, nameInput: !!nameInput, typeSelect: !!typeSelect, statusSelect: !!statusSelect, submitBtn: !!submitBtn });
        console.log('API functions available:', {
            formatTanzaniaPhone: typeof window.velaaAPI?.formatTanzaniaPhone,
            validateTanzaniaPhone: typeof window.velaaAPI?.validateTanzaniaPhone
        });
        
        // Check if user is authenticated
        if (!window.velaaAPI?.token) {
            console.log('No authentication token found, redirecting to login');
            NotificationManager.error('Please login first to edit clients');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
            return;
        }
        
        // Get client ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('id');
        
        if (!clientId) {
            console.error('No client ID provided in URL');
            NotificationManager.error('No client ID provided');
            window.location.href = 'clients.html';
            return;
        }
        
        console.log('Authentication token found:', window.velaaAPI.token);
        
        let clientData = null;
        
        // Load client data from API
        try {
            console.log('Loading client data for ID:', clientId);
            console.log('API mock mode:', window.velaaAPI?.mockMode);
            loadingManager.show('load-client', 'Loading client data...');
            
            const response = await window.velaaAPI.getClient(clientId);
            console.log('Client data loaded:', response);
            
            clientData = response.data;
            
            // Populate form fields
            if (clientData) {
                nameInput.value = clientData.name || '';
                phoneInput.value = clientData.phone || '';
                typeSelect.value = (clientData.type || '').toLowerCase();
                statusSelect.value = clientData.isActive ? 'active' : 'inactive';
                
                console.log('Form populated with client data:', {
                    name: clientData.name,
                    phone: clientData.phone,
                    type: clientData.type,
                    isActive: clientData.isActive
                });
            } else {
                console.warn('No client data received from API');
                NotificationManager.error('No client data found for the given ID');
            }
            
            // Hide page loader after data is loaded
            setTimeout(() => {
                if (pageLoader) pageLoader.classList.add('hidden');
                if (pageContent) pageContent.classList.add('loaded');
            }, 300);
            
        } catch (error) {
            console.error('Error loading client data:', error);
            
            // Hide loader on error
            setTimeout(() => {
                if (pageLoader) pageLoader.classList.add('hidden');
                if (pageContent) pageContent.classList.add('loaded');
            }, 1000);
            console.error('Error details:', {
                message: error.message,
                status: error.status,
                data: error.data
            });
            
            if (error.message && error.message.includes('Access denied')) {
                NotificationManager.error('Authentication failed. Please login again.');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            } else if (error.message && error.message.includes('Token is invalid')) {
                NotificationManager.error('Your session has expired. Please login again.');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            } else {
                // Don't redirect immediately, show error and let user decide
                NotificationManager.error('Failed to load client data: ' + error.message);
                
                // Show a retry button instead of redirecting
                const retryButton = document.createElement('button');
                retryButton.textContent = 'Retry Loading';
                retryButton.className = 'retry-btn';
                retryButton.style.cssText = 'margin: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;';
                retryButton.onclick = () => {
                    window.location.reload();
                };
                
                const form = document.querySelector('.client-form');
                if (form) {
                    form.innerHTML = '';
                    form.appendChild(retryButton);
                }
            }
            
        } finally {
            loadingManager.hide('load-client');
        }
        
        // Phone number formatting
        if (phoneInput) {
            phoneInput.addEventListener('input', (e) => {
                const formatted = window.velaaAPI.formatTanzaniaPhone(e.target.value);
                e.target.value = formatted;
            });
        }
        
        // Clear field errors
        function clearFieldErrors() {
            document.querySelectorAll('.form__error').forEach(error => {
                error.textContent = '';
                error.style.display = 'none';
            });
        }
        
        // Set field error
        function setFieldError(field, message) {
            const errorElement = document.querySelector(`[data-error-for="${field}"]`);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }
        
        // Validate client data
        function validateClientData(client) {
            const errors = [];
            
            if (!client.name || client.name.trim().length < 2) {
                errors.push({ field: 'name', message: 'Name must be at least 2 characters long' });
            }
            
            if (!client.phone || !window.velaaAPI.validateTanzaniaPhone(client.phone)) {
                errors.push({ field: 'phone', message: 'Please enter a valid Tanzania phone number' });
            }
            
            if (!client.type || !['individual', 'company', 'dealer'].includes(client.type.toLowerCase())) {
                errors.push({ field: 'type', message: 'Please select a valid client type' });
            }
            
            return errors;
        }
        
        // Form submission
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('Form submitted, preventing default');
                try {
                    loadingManager.show('update-client', 'Updating client...');
                    const formData = new FormData(form);

                    const client = {
                        name: (formData.get('client_name') || '').toString().trim(),
                        phone: window.velaaAPI.formatTanzaniaPhone(formData.get('phone_number') || ''),
                        type: (formData.get('client_type') || '').toString().charAt(0).toUpperCase() + (formData.get('client_type') || '').toString().slice(1),
                        isActive: formData.get('system_status') === 'active'
                    };

                    clearFieldErrors();
                    const frontErrors = validateClientData(client);
                    console.log('Frontend validation errors:', frontErrors);
                    if (frontErrors.length) {
                        frontErrors.forEach(e => setFieldError(e.field, e.message));
                        NotificationManager.error('Please correct the highlighted errors.');
                        return;
                    }

                    console.log('Client data to update:', client);
                    const response = await window.velaaAPI.updateClient(clientId, client);
                    console.log('Update response:', response);
                    NotificationManager.success('Client updated successfully');
                    window.location.href = 'clients.html';
                    return response;
                } catch (err) {
                    console.error(err);
                    let msg = err?.getUserMessage ? err.getUserMessage() : (err?.message || 'Failed to update client');

                    if (err?.data?.errors) {
                        if (Array.isArray(err.data.errors)) {
                            const details = err.data.errors.map(e => `${e.field}: ${e.message}`).join(' | ');
                            msg = `${msg} (${details})`;
                        } else if (typeof err.data.errors === 'object') {
                            const details = Object.entries(err.data.errors).map(([k,v]) => `${k}: ${Array.isArray(v)?v.join(', '):v}`).join(' | ');
                            msg = `${msg} (${details})`;
                        }
                    }

                    NotificationManager.error(msg);
                } finally {
                    loadingManager.hide('update-client');
                }
            });
        }
    });
    </script>
</body>
</html>
